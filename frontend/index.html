<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karachi University Herbarium</title>

    <!-- Inline CSS for instant rendering before JS loads -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        color: #0f5132;
        z-index: 99999;
      }

      .app-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #0f5132;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
        margin-bottom: 16px;
      }

      @keyframes app-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- 
      This loader lives directly inside #root. 
      Browser renders it INSTANTLY when downloading JS bundles.
      React replaces this entire div once it finishes booting up.
    -->
    <div id="root">
      <div id="app-loader">
        <div class="app-spinner"></div>
        <p style="font-size: 15px; font-weight: 600; margin: 0;">Loading ...</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
